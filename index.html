       FORM

    input,

    select {

    input:focus,
    textarea:focus,

    }

    .submit-button {

      font-weight: bold;

    }

    .submit-button:hover {
      background: #0369a1;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-size: 14px;
    }

    .footer-ktl {
      color: #0284c7;

    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .top-section {
        grid-template-columns: 1fr;
      }

      }

        flex-direction: column;

      }

    @media (max-width: 500px) {

        flex-direction: column;

        flex-direction: column;

  </style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

  <div class="header-content">

    <div class="ktl-logo">
      KTL
    </div>

    <div class="header-text">
      <h1>KTL Lost & Found</h1>
      <p>Helping lost items find their owners</p>
    </div>

  </div>

</header>


<!-- =========================
     NAVIGATION
========================= -->

<nav>

  <button
    id="lostTab"
    class="active"
    onclick="changeTab('lost')"
  >
    🔵 Lost Items
  </button>

  <button
    id="foundTab"
    onclick="changeTab('found')"
  >
    🔷 Found Items
  </button>

</nav>


<div class="container">

  <div class="top-section">

    <!-- =====================
         MAIN CONTENT
    ====================== -->

    <main>

      <button
        class="create-button"
        onclick="openModal()"
      >
        ＋ Create a Post
      </button>


      <div class="search">

        <input
          type="text"
          id="searchInput"
          placeholder="🔎 Search for an item..."
          oninput="renderPosts()"
        >

      </div>


      <div class="card">

        <h2 id="sectionTitle">
          Lost Items
        </h2>

        <div id="postsContainer"></div>

      </div>

    </main>


    <!-- =====================
         SIDEBAR
    ====================== -->

    <aside class="sidebar">

      <div class="card">

        <h2>
          🏆 Frequent Losers
        </h2>

        <div id="usersStats"></div>

      </div>


      <div class="card">

        <h2>
          📦 Frequently Lost
        </h2>

        <div id="itemsStats"></div>

      </div>

    </aside>

  </div>

</div>


<!-- =========================
     MODAL
========================= -->

<div
  class="modal"
  id="modal"
>

  <div class="modal-content">

    <div class="modal-header">

      <h2>
        Create a Post
      </h2>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <form id="postForm">

      <div class="form-group">

        <label>
          Post Type <span class="required">*</span>
        </label>

        <select id="type" required>

          <option value="lost">
            I lost an item
          </option>

          <option value="found">
            I found an item
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>
          Item Name <span class="required">*</span>
        </label>

        <input
          type="text"
          id="title"
          placeholder="Example: Black wallet"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Item Description <span class="required">*</span>
        </label>

        <textarea
          id="description"
          placeholder="Describe the item in detail: color, size, brand, special marks, contents, etc."
          required
        ></textarea>

      </div>


      <div class="form-group">

        <label>
          Location
        </label>

        <input
          type="text"
          id="location"
          placeholder="Example: Room 205"
        >

      </div>


      <div class="form-group">

        <label>
          Your Name <span class="required">*</span>
        </label>

        <input
          type="text"
          id="author"
          placeholder="Example: Arman"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Class
        </label>

        <input
          type="text"
          id="className"
          placeholder="Example: 10A"
        >

      </div>


      <button
        class="submit-button"
        type="submit"
      >
        Publish Post
      </button>

    </form>

  </div>

</div>


<!-- =========================
     FOOTER
========================= -->

<footer>

  <span class="footer-ktl">KTL</span>
  Lost & Found · School Community

</footer>


<script>

  // =========================
  // DATA
  // =========================

  let posts =
    JSON.parse(
      localStorage.getItem("ktlLostFound")
    ) || [

      {
        id: 1,
        type: "lost",
        title: "Black Sports Jacket",
        description:
          "Black Nike jacket, size M. There is a small white logo on the left sleeve.",
        location: "Gym",
        author: "Daniyar",
        className: "10A",
        date: "09/08/2026"
      },

      {
        id: 2,
        type: "lost",
        title: "Blue Water Bottle",
        description:
          "Blue metal water bottle with a mountain sticker on it.",
        location: "Cafeteria",
        author: "Alina",
        className: "9B",
        date: "09/07/2026"
      },

      {
        id: 3,
        type: "found",
        title: "Gray Pencil Case",
        description:
          "Gray pencil case with three compartments. Contains several pens and pencils.",
        location: "Room 204",
        author: "Marat",
        className: "11A",
        date: "09/08/2026"
      }

    ];


  let currentTab = "lost";


  // =========================
  // SAVE DATA
  // =========================

  function savePosts() {

    localStorage.setItem(
      "ktlLostFound",
      JSON.stringify(posts)
    );

  }


  // =========================
  // CHANGE TAB
  // =========================

  function changeTab(type) {

    currentTab = type;

    document
      .getElementById("lostTab")
      .classList.toggle(
        "active",
        type === "lost"
      );

    document
      .getElementById("foundTab")
      .classList.toggle(
        "active",
        type === "found"
      );

    document.getElementById(
      "sectionTitle"
    ).textContent =
      type === "lost"
        ? "Lost Items"
        : "Found Items";

    renderPosts();

  }


  // =========================
  // RENDER POSTS
  // =========================

  function renderPosts() {

    const container =
      document.getElementById(
        "postsContainer"
      );

    const search =
      document
        .getElementById("searchInput")
        .value
        .toLowerCase();


    const filteredPosts =
      posts.filter(post => {

        const matchesTab =
          post.type === currentTab;

        const matchesSearch =
          post.title
            .toLowerCase()
            .includes(search) ||

          post.description
            .toLowerCase()
            .includes(search) ||

          post.author
            .toLowerCase()
            .includes(search);

        return (
          matchesTab &&
          matchesSearch
        );

      });


    if (
      filteredPosts.length === 0
    ) {

      container.innerHTML = `

        <div class="empty">

          <div style="font-size:40px;">
            🔍
          </div>

          <p>
            No posts found.
          </p>

        </div>

      `;

      return;
    }


    container.innerHTML =
      filteredPosts
        .sort(
          (a, b) =>
            b.id - a.id
        )
        .map(post => `

          <article class="post">

            <div class="post-header">

              <div class="post-title">
                ${escapeHTML(
                  post.title
                )}
              </div>

              <span
                class="badge ${post.type}"
              >
                ${
                  post.type === "lost"
                    ? "LOST"
                    : "FOUND"
                }
              </span>

            </div>


            <div class="description">

              <strong>
                Description:
              </strong>

              ${escapeHTML(
                post.description
              )}

            </div>


            <div class="post-info">

              <span>
                📍
                ${
                  escapeHTML(
                    post.location ||
                    "Location not specified"
                  )
                }
              </span>

              <span>
                📅
                ${escapeHTML(post.date)}
              </span>

              <span>

                👤

                <span class="post-author">
                  ${escapeHTML(
                    post.author
                  )}
                </span>

                ${
                  post.className
                    ? " · " +
                      escapeHTML(
                        post.className
                      )
                    : ""
                }

              </span>

            </div>


            <button
              class="delete-button"
              onclick="deletePost(${post.id})"
            >
              Delete
            </button>

          </article>

        `)
        .join("");

  }


  // =========================
  // CREATE POST
  // =========================

  document
    .getElementById("postForm")
    .addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        const type =
          document.getElementById(
            "type"
          ).value;

        const title =
          document.getElementById(
            "title"
          ).value.trim();

        const description =
          document.getElementById(
            "description"
          ).value.trim();

        const location =
          document.getElementById(
            "location"
          ).value.trim();

        const author =
          document.getElementById(
            "author"
          ).value.trim();

        const className =
          document.getElementById(
            "className"
          ).value.trim();


        if (
          !title ||
          !description ||
          !author
        ) {

          alert(
            "Please fill in all required fields."
          );

          return;

        }


        if (
          description.length < 10
        ) {

          alert(
            "Please provide a more detailed description of the item."
          );

          return;

        }


        const newPost = {

          id: Date.now(),

          type,

          title,

          description,

          location,

          author,

          className,

          date:
            new Date()
              .toLocaleDateString(
                "en-US"
              )

        };


        posts.push(newPost);

        savePosts();

        closeModal();

        document
          .getElementById(
            "postForm"
          )
          .reset();

        changeTab(type);

        updateStatistics();

        alert(
          "Your post has been published! 🎉"
        );

      }
    );


  // =========================
  // DELETE POST
  // =========================

  function deletePost(id) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this post?"
      );

    if (!confirmed) return;


    posts =
      posts.filter(
        post => post.id !== id
      );

    savePosts();

    renderPosts();

    updateStatistics();

  }


  // =========================
  // USER STATISTICS
  // =========================

  function updateUserStatistics() {

    const users = {};


    posts
      .filter(
        post =>
          post.type === "lost"
      )
      .forEach(post => {

        users[post.author] =
          (users[post.author] || 0) + 1;

      });


    const sortedUsers =
      Object.entries(users)
        .sort(
          (a, b) =>
            b[1] - a[1]
        )
        .slice(0, 5);


    const container =
      document.getElementById(
        "usersStats"
      );


    if (
      sortedUsers.length === 0
    ) {

      container.innerHTML =
        "<p style='color:#94a3b8;'>No data yet.</p>";

      return;

    }


    container.innerHTML =
      sortedUsers
        .map(
          ([name, count], index) => `

            <div class="stat-item">

              <span>

                ${
                  index === 0
                    ? "🥇"
                    : index === 1
                    ? "🥈"
                    : index === 2
                    ? "🥉"
                    : "👤"
                }

                ${escapeHTML(name)}

              </span>

              <span class="number">
                ${count}
              </span>

            </div>

          `
        )
        .join("");

  }


  // =========================
  // ITEM STATISTICS
  // =========================

  function updateItemStatistics() {

    const items = {};


    posts
      .filter(
        post =>
          post.type === "lost"
      )
      .forEach(post => {

        const name =
          post.title.toLowerCase();

        items[name] =
          (items[name] || 0) + 1;

      });


    const sortedItems =
      Object.entries(items)
        .sort(
          (a, b) =>
            b[1] - a[1]
        )
        .slice(0, 7);


    const container =
      document.getElementById(
        "itemsStats"
      );


    if (
      sortedItems.length === 0
    ) {

      container.innerHTML =
        "<p style='color:#94a3b8;'>No data yet.</p>";

      return;

    }


    container.innerHTML =
      sortedItems
        .map(
          ([item, count]) => `

            <div class="stat-item">

              <span>
                📦
                ${escapeHTML(item)}
              </span>

              <span class="number">
                ${count}
              </span>

            </div>

          `
        )
        .join("");

  }


  function updateStatistics() {

    updateUserStatistics();

    updateItemStatistics();

  }


  // =========================
  // MODAL
  // =========================

  function openModal() {

    document
      .getElementById("modal")
      .classList.add("show");

    document.getElementById(
      "type"
    ).value = currentTab;

  }


  function closeModal() {

    document
      .getElementById("modal")
      .classList.remove("show");

  }


  window.addEventListener(
    "click",
    function(event) {

      const modal =
        document.getElementById(
          "modal"
        );

      if (
        event.target === modal
      ) {

        closeModal();

      }

    }
  );


  // =========================
  // HTML SECURITY
  // =========================

  function escapeHTML(text) {

    return String(text)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  // =========================
  // START
  // =========================

  renderPosts();

  updateStatistics();

</script>

</body>
</html>
```
